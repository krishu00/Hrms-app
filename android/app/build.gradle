apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// Configuration block for React Native Android app
react {
    apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")
    autolinkLibrariesWithApp() // Autolinking enabled for libraries
}

// Enabling or disabling Proguard
def enableProguardInReleaseBuilds = false

// Preferred build flavor for JavaScriptCore (JSC)
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    compileSdkVersion 34
    buildToolsVersion "34.0.0"

    // Fix for task dependencies
    tasks.whenTaskAdded { task ->
        if (task.name == "generateDebugLintReportModel" || task.name == "lintAnalyzeDebug") {
            task.dependsOn "copyReactNativeVectorIconFonts"
        }
    }

    namespace "com.hrms.daksh"
    defaultConfig {
        applicationId "com.hrms.daksh"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"

           // Add the NDK ABI filters to exclude unnecessary architectures
    ndk {
        abiFilters "armeabi-v7a", "arm64-v8a" // Exclude x86 and x86_64 for size optimization
    }
    }
    
    signingConfigs { release {
            if (project.hasProperty('MYAPP_UPLOAD_STORE_FILE')) {
                storeFile file(MYAPP_UPLOAD_STORE_FILE)
                storePassword MYAPP_UPLOAD_STORE_PASSWORD
                keyAlias MYAPP_UPLOAD_KEY_ALIAS
                keyPassword MYAPP_UPLOAD_KEY_PASSWORD
            }
        }
        
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation project(':react-native-vector-icons') // Vector icons dependency

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
   